stages:
  - test
  - quality
  - build

before_script:
  - export PATH=$PATH:/usr/local/go/bin:~/go/bin
  - docker compose -f deploy/docker-compose.yml up -d postgres nats
  - sleep 3

test_job:
  stage: test
  script:
    - make test

unit_tests:
  stage: test
  script:
    - echo "Running Go Unit Tests with Race Detector across all workspace modules..."
    - cd pkg && go test -v -race -coverprofile=coverage.out ./... && cd ..
    - cd services/gateway && go test -v -race -coverprofile=coverage.out ./... && cd ../..
    - cd services/publisher && go test -v -race -coverprofile=coverage.out ./internal/generator ./internal/healthmgr && cd ../..
    - cd services/depositor && go test -v -race -coverprofile=coverage.out ./internal/worker && cd ../..
    - cd services/dashboard && go test -v -race -coverprofile=coverage.out ./... && cd ../..
  artifacts:
    paths:
      - pkg/coverage.out
      - services/gateway/coverage.out
      - services/publisher/coverage.out
      - services/depositor/coverage.out
      - services/dashboard/coverage.out
    expire_in: 1 hour

sonarqube_check:
  stage: quality
  needs: ["unit_tests"]
  script:
    - docker run --rm --network host -e SONAR_HOST_URL="http://localhost:9000" -e SONAR_TOKEN="${SONAR_TOKEN}" -v "$(pwd):/usr/src" sonarsource/sonar-scanner-cli

build_services:
  stage: build
  needs: ["unit_tests"]
  parallel:
    matrix:
      - SERVICE: [dashboard, depositor, gateway, publisher]
  script:
    - echo "Generating vendor directory from local Go cache..."
    - go work vendor
    - echo "Building Docker image for $SERVICE..."
    - docker build -t eventledger/$SERVICE:$CI_COMMIT_SHORT_SHA -f services/$SERVICE/Dockerfile .