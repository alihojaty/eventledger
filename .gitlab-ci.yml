stages:
  - test
  - quality
  - build

before_script:
  - export PATH=$PATH:/usr/local/go/bin:~/go/bin

# ۱. اجرای تست‌های واحد (Unit Tests)
unit_tests:
  stage: test
  script:
    - go version
    - echo "Running tests in pkg..."
    - cd pkg && go test -v -race ./...
    - echo "Running tests in gateway..."
    - cd ../services/gateway && go test -v -race ./...

# ۲. بررسی کیفیت کد با SonarQube
sonarqube_check:
  stage: quality
  script:
    - |
      docker run --rm \
        --network host \
        -v "$(pwd):/usr/src" \
        sonarsource/sonar-scanner-cli \
        -Dsonar.host.url="${SONAR_HOST_URL:-http://localhost:9000}" \
        -Dsonar.token="${SONAR_TOKEN}"
  allow_failure: true
  only:
    - main

# ۳. بیلد همزمان ایمیج‌های داکر
build_services:
  stage: build
  parallel:
    matrix:
      - SERVICE: [dashboard, depositor]
  script:
    - echo "Building Docker image for $SERVICE..."
    - docker build -t my-project/$SERVICE:$CI_COMMIT_SHORT_SHA -f services/$SERVICE/Dockerfile .
    - docker tag my-project/$SERVICE:$CI_COMMIT_SHORT_SHA my-project/$SERVICE:latest