stages:
  - test
  - quality
  - build

variables:
  GO_VERSION:

  DOCKER_DRIVER: overlay2


.go-cache:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/


unit_tests:
  stage: test
  image: golang:${GO_VERSION}-alpine
  extends: .go-cache
  script:
    - echo "Running tests for shared pkg..."
    - cd pkg && go test -v -race ./... && cd ..
    - echo "Running tests for gateway..."
    - cd services/gateway && go test -v -race ./... && cd ../..

sonarqube_check:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  only:
    - main
    - merge_requests
  allow_failure: true


build_services:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  parallel:
    matrix:
      - SERVICE: [dashboard, depositor]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "Building Docker image for $SERVICE..."

    - docker build -f services/$SERVICE/Dockerfile -t "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/$SERVICE:latest" .
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE:latest"
  only:
    - main
