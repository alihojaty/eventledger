services:
  nats:
    image: nats:latest
    container_name: nats
    restart: unless-stopped

    command:
      - "--jetstream"
      - "--store_dir=/data/jetstream"
      - "--http_port=8222"

    ports:
      - "4222:4222"   # Client connections
      - "6222:6222"   # Cluster routing
      - "8222:8222"   # Monitoring

    volumes:
      - nats_data:/data/jetstream

volumes:
  nats_data:
    name: nats_data
