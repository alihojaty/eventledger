apiVersion: 1

providers:
  - name: "Deposit Processor Dashboards"
    orgId: 1
    folder: "Reliable Deposit Processor"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
