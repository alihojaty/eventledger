version: "3.9"

networks:
  deposit_overlay:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  nats_data:

secrets:
  deposit_api_key:
    external: true
  deposit_postgres_password:
    external: true

services:
  postgres:
    image: postgres:18-alpine
    networks:
      - deposit_overlay
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - source: deposit_postgres_password
        target: postgres_password
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: deposits_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deposits_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.stateful == true
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 15s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: stop-first

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    networks:
      - deposit_overlay
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.stateful == true
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 15s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: stop-first

  depositor:
    image: ${REGISTRY:-127.0.0.1:5000}/reliable-deposit-depositor:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - deposit_overlay
    secrets:
      - source: deposit_postgres_password
        target: postgres_password
    stop_grace_period: 25s
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: deposits_db
      DB_SSLMODE: disable
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      MIGRATIONS_PATH: file:///app/migrations
      NATS_URL: nats://nats:4222
      WORKER_COUNT: "4"
      RETRY_INTERVAL: 5s
      SHUTDOWN_TIMEOUT: 15s
      METRICS_PORT: "8080"
      LOG_LEVEL: info
    deploy:
      replicas: 3
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: start-first

  publisher:
    image: ${REGISTRY:-127.0.0.1:5000}/reliable-deposit-publisher:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - deposit_overlay
    stop_grace_period: 25s
    environment:
      NATS_URL: nats://nats:4222
      PUBLISH_ENABLED: "false"
      PUBLISH_INTERVAL: 1s
      PUBLISHER_GRPC_PORT: "50051"
      SHUTDOWN_TIMEOUT: 10s
      LOG_LEVEL: info
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: start-first

  gateway:
    image: ${REGISTRY:-127.0.0.1:5000}/reliable-deposit-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - deposit_overlay
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
        mode: ingress
    secrets:
      - source: deposit_api_key
        target: api_key
    stop_grace_period: 15s
    environment:
      GATEWAY_PORT: "8081"
      PUBLISHER_GRPC_ADDR: publisher:50051
      API_KEY_FILE: /run/secrets/api_key
      REQUEST_TIMEOUT: 3s
      SHUTDOWN_TIMEOUT: 10s
      RATE_LIMIT_RPS: "50000"
      RATE_LIMIT_BURST: "10000"
      GRPC_MAX_ATTEMPTS: "3"
      GRPC_RETRY_BACKOFF: 50ms
      MTLS_ENABLED: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: start-first

  dashboard:
    image: ${REGISTRY:-127.0.0.1:5000}/reliable-deposit-dashboard:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - deposit_overlay
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    secrets:
      - source: deposit_api_key
        target: api_key
      - source: deposit_postgres_password
        target: postgres_password
    stop_grace_period: 10s
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: deposits_db
      DB_SSLMODE: disable
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      NATS_URL: nats://nats:4222
      GATEWAY_URL: http://gateway:8081
      API_KEY_FILE: /run/secrets/api_key
      PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/stats >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 15s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: start-first