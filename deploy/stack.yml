version: "3.9"

networks:
  deposit_overlay:
    name: deposit_overlay
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  nats_data:
  prometheus_data:

secrets:
  deposit_api_key:
    external: true
  deposit_postgres_password:
    external: true

services:
  postgres:
    image: postgres:18-alpine
    command:
      - "postgres"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "commit_delay=100"
      - "-c"
      - "commit_siblings=5"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "wal_buffers=32MB"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    networks:
      - deposit_overlay
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - source: deposit_postgres_password
        target: postgres_password
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: deposits_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deposits_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.stateful == true
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 15s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: stop-first

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    networks:
      - deposit_overlay
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.stateful == true
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 15s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: stop-first

  depositor:
    image: ${REGISTRY:-127.0.0.1:5000}/reliable-deposit-depositor:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - deposit_overlay
    secrets:
      - source: deposit_postgres_password
        target: postgres_password
    stop_grace_period: 25s
    environment:
      IMAGE_TAG: ${IMAGE_TAG}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: deposits_db
      DB_SSLMODE: disable
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      MIGRATIONS_PATH: file:///app/migrations
      NATS_URL: nats://nats:4222
      WORKER_COUNT: "32"
      RETRY_INTERVAL: 5s
      SETTLEMENT_INTERVAL: 5s
      SHUTDOWN_TIMEOUT: 15s
      METRICS_PORT: "9090"
      LOG_LEVEL: warn
    deploy:
      replicas: 4
      endpoint_mode: dnsrr
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 2
        delay: 2s
        failure_action: rollback
        monitor: 5s
        max_failure_ratio: 0
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: start-first

  publisher:
    image: ${REGISTRY:-127.0.0.1:5000}/reliable-deposit-publisher:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - deposit_overlay
    stop_grace_period: 25s
    environment:
      IMAGE_TAG: ${IMAGE_TAG}
      NATS_URL: nats://nats:4222
      PUBLISH_ENABLED: "false"
      PUBLISH_INTERVAL: 1s
      PUBLISHER_GRPC_PORT: "50051"
      PUBLISHER_HEALTH_PORT: "8090"
      METRICS_PORT: "9090"
      DRAIN_DELAY: 6s
      SHUTDOWN_TIMEOUT: 10s
      FORCE_UNHEALTHY: "false"
      LOG_LEVEL: warn
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/livez >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 2
      start_period: 5s
    deploy:
      replicas: 3
      endpoint_mode: dnsrr
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 2
        delay: 1s
        failure_action: rollback
        monitor: 5s
        max_failure_ratio: 0
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: start-first

  gateway:
    image: ${REGISTRY:-127.0.0.1:5000}/reliable-deposit-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - deposit_overlay
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
        mode: ingress
    secrets:
      - source: deposit_api_key
        target: api_key
    stop_grace_period: 15s
    environment:
      IMAGE_TAG: ${IMAGE_TAG}
      GATEWAY_PORT: "8081"
      METRICS_PORT: "9090"
      PUBLISHER_GRPC_ADDR: publisher:50051
      DNS_REFRESH_INTERVAL: 2s
      API_KEY_FILE: /run/secrets/api_key
      REQUEST_TIMEOUT: 3s
      SHUTDOWN_TIMEOUT: 10s
      RATE_LIMIT_RPS: "200000"
      RATE_LIMIT_BURST: "50000"
      GRPC_MAX_ATTEMPTS: "3"
      GRPC_RETRY_BACKOFF: 50ms
      MTLS_ENABLED: "false"
      LOG_LEVEL: warn
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 4
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 2
        delay: 2s
        failure_action: rollback
        monitor: 5s
        max_failure_ratio: 0
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: start-first

  dashboard:
    image: ${REGISTRY:-127.0.0.1:5000}/reliable-deposit-dashboard:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - deposit_overlay
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    secrets:
      - source: deposit_api_key
        target: api_key
      - source: deposit_postgres_password
        target: postgres_password
    stop_grace_period: 10s
    environment:
      IMAGE_TAG: ${IMAGE_TAG}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: deposits_db
      DB_SSLMODE: disable
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      NATS_URL: nats://nats:4222
      GATEWAY_URL: http://gateway:8081
      API_KEY_FILE: /run/secrets/api_key
      PORT: "8080"
      METRICS_PORT: "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 15s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 2s
        failure_action: pause
        monitor: 10s
        order: start-first

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.15.0
    command:
      - "-varz"
      - "-connz"
      - "-routez"
      - "-subz"
      - "-jsz=all"
      - "-port=7777"
      - "http://nats:8222"
    networks:
      - deposit_overlay
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    command:
      - "--extend.query-path=/etc/postgres_exporter/queries.yml"
    networks:
      - deposit_overlay
    secrets:
      - source: deposit_postgres_password
        target: postgres_password
    volumes:
      - ./prometheus/postgres_exporter_queries.yml:/etc/postgres_exporter/queries.yml:ro
    environment:
      DATA_SOURCE_URI: "postgres:5432/deposits_db?sslmode=disable"
      DATA_SOURCE_USER: "postgres"
      DATA_SOURCE_PASS_FILE: "/run/secrets/postgres_password"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--enable-feature=native-histograms,exemplar-storage"
      - "--web.enable-lifecycle"
    networks:
      - deposit_overlay
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: ingress
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.stateful == true
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s

  grafana:
    image: grafana/grafana-oss:11.2.0
    networks:
      - deposit_overlay
    ports:
      - target: 3000
        published: 3030
        protocol: tcp
        mode: ingress
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_USERS_DEFAULT_THEME: "light"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/deposit-overview.json"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 0
        window: 60s