global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    cluster: "deposit-swarm"

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "gateway"
    metrics_path: "/metrics"
    dns_sd_configs:
      - names:
          - "tasks.gateway"
        type: "A"
        port: 9090
        refresh_interval: 5s
    relabel_configs:
      - target_label: "service"
        replacement: "gateway"

  - job_name: "publisher"
    metrics_path: "/metrics"
    dns_sd_configs:
      - names:
          - "tasks.publisher"
        type: "A"
        port: 9090
        refresh_interval: 5s
    relabel_configs:
      - target_label: "service"
        replacement: "publisher"

  - job_name: "depositor"
    metrics_path: "/metrics"
    dns_sd_configs:
      - names:
          - "tasks.depositor"
        type: "A"
        port: 9090
        refresh_interval: 5s
    relabel_configs:
      - target_label: "service"
        replacement: "depositor"

  - job_name: "dashboard"
    metrics_path: "/metrics"
    dns_sd_configs:
      - names:
          - "tasks.dashboard"
        type: "A"
        port: 9090
        refresh_interval: 5s
    relabel_configs:
      - target_label: "service"
        replacement: "dashboard"

  - job_name: "nats-exporter"
    metrics_path: "/metrics"
    dns_sd_configs:
      - names:
          - "tasks.nats-exporter"
        type: "A"
        port: 7777
        refresh_interval: 10s
    relabel_configs:
      - target_label: "service"
        replacement: "nats"

  - job_name: "postgres-exporter"
    metrics_path: "/metrics"
    dns_sd_configs:
      - names:
          - "tasks.postgres-exporter"
        type: "A"
        port: 9187
        refresh_interval: 10s
    relabel_configs:
      - target_label: "service"
        replacement: "postgres"