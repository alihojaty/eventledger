services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deposits_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deposits_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  depositor:
    build:
      context: ..
      dockerfile: services/depositor/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/deposits_db?sslmode=disable
      MIGRATIONS_PATH: file://migrations
      NATS_URL: nats://nats:4222
      WORKER_COUNT: 3
      RETRY_INTERVAL: 5s
      SHUTDOWN_TIMEOUT: 10s
      METRICS_PORT: 8080
      LOG_LEVEL: info
    ports:
      - "8080-8085:8080"
    stdin_open: true
    tty: true
    restart: unless-stopped

  publisher:
    build:
      context: ..
      dockerfile: services/publisher/Dockerfile
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      PUBLISH_ENABLED: "true"
      PUBLISH_INTERVAL: 1s
      LOG_LEVEL: info
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data: