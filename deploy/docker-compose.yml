services:
  postgres:
    image: postgres:18-alpine
    command:
      - "postgres"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "commit_delay=100"
      - "-c"
      - "commit_siblings=5"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "wal_buffers=32MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deposits_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deposits_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  depositor:
    build:
      context: ..
      dockerfile: services/depositor/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    stop_grace_period: 25s
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://postgres:postgres@postgres:5432/deposits_db?sslmode=disable}
      MIGRATIONS_PATH: file:///app/migrations
      NATS_URL: ${NATS_URL_DOCKER:-nats://nats:4222}
      WORKER_COUNT: ${WORKER_COUNT:-3}
      RETRY_INTERVAL: ${RETRY_INTERVAL:-5s}
      SETTLEMENT_INTERVAL: ${SETTLEMENT_INTERVAL:-5s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      METRICS_PORT: ${METRICS_PORT:-9090}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    deploy:
      replicas: 5
    restart: unless-stopped

  publisher:
    build:
      context: ..
      dockerfile: services/publisher/Dockerfile
    depends_on:
      nats:
        condition: service_healthy
    stop_grace_period: 25s
    environment:
      NATS_URL: ${NATS_URL_DOCKER:-nats://nats:4222}
      PUBLISH_ENABLED: ${PUBLISH_ENABLED:-false}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-1s}
      PUBLISHER_GRPC_PORT: 50051
      PUBLISHER_HEALTH_PORT: 8090
      METRICS_PORT: 9090
      DRAIN_DELAY: ${DRAIN_DELAY:-6s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    depends_on:
      publisher:
        condition: service_started
    stop_grace_period: 15s
    environment:
      GATEWAY_PORT: 8081
      METRICS_PORT: 9090
      PUBLISHER_GRPC_ADDR: publisher:50051
      API_KEY: ${API_KEY:-dev-secret-api-key}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-3s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-500}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
      GRPC_MAX_ATTEMPTS: ${GRPC_MAX_ATTEMPTS:-3}
      GRPC_RETRY_BACKOFF: ${GRPC_RETRY_BACKOFF:-50ms}
      MTLS_ENABLED: ${MTLS_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: services/dashboard/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://postgres:postgres@postgres:5432/deposits_db?sslmode=disable}
      NATS_URL: ${NATS_URL_DOCKER:-nats://nats:4222}
      GATEWAY_URL: http://gateway:8081
      API_KEY: ${API_KEY:-dev-secret-api-key}
      PORT: 8080
      METRICS_PORT: 9090
    ports:
      - "8080:8080"
    restart: unless-stopped

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.15.0
    command: ["-varz", "-connz", "-routez", "-subz", "-jsz=all", "-port=7777", "http://nats:8222"]
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    command: ["--extend.query-path=/etc/postgres_exporter/queries.yml"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./prometheus/postgres_exporter_queries.yml:/etc/postgres_exporter/queries.yml:ro
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/deposits_db?sslmode=disable"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--enable-feature=exemplar-storage"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    ports:
      - "3030:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_USERS_DEFAULT_THEME: "light"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/deposit-overview.json"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
  prometheus_data: