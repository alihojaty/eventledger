services:
  postgres:
    image: postgres:latest
    container_name: deposit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deposits_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deposits_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:latest
    container_name: deposit_nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deposit_processor
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/deposits_db?sslmode=disable
      MIGRATIONS_PATH: file://migrations
      NATS_URL: nats://nats:4222
      PUBLISH_ENABLED: "true"
      PUBLISH_INTERVAL: 1s
      WORKER_COUNT: 3
      RETRY_INTERVAL: 5s
      SHUTDOWN_TIMEOUT: 10s
      METRICS_PORT: 8080
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    profiles:
      - full
volumes:
  postgres_data:
  nats_data: